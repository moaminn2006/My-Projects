<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Form</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <h1>Contact information</h1>
    <body>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="Full Name" value ="Mohamed"><br><br>
            <label for="em">Email:</label>
            <input type="text" id="em" name="email" value="M@gmail.com"><br><br>
            <label for="num">Phone Number:</label>
            <input type="number" id="num" name="telephone number" value="+250362"><br><br>
            <label for="date">Date:</label>
            <input type="date" id="date" name="Date" value="20/9/2001"><br><br>
            <label for="gen">Gender:</label>
            <label for="gen">male</label>
            <input type="radio" id="gen" name="Gender" value="male">
            <label for="gen">female</label>
            <input type="radio" id="gen" name="Gender" value="female"><br><br>
            <label for="pref">What are your preferences:</label>
            <select for="pref" name="preference">
                <option value="sports">Sport</option>
                <option value="Food">Eating food</option>
                <option value="sleep">sleeping</option>
            </select><br>
            <label for="Enj">Where do you go on weekend:</label>
            <label for="Enj">cinema:</label>
            <input type="checkbox" id="Enj" name="Enjoyments" value="Cinema">
            <label for="Enj">club</label>
            <input type="checkbox" id="Enj" name="Enjoyments" value="club"><br><br>
            <label for="add">Add your comments</label>
            <input type="text" id="add" name="comments" value="No need"><br>
            <input type="submit">
        </form>
    </body>
</html>
